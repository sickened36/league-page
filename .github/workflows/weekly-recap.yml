name: Fantasy Foosball Weekly Recap

on:
  schedule:
    # Avoid the top of the hour, when GitHub scheduled workflows are more likely to queue late.
    # 15:17 UTC = 10:17 AM CDT / 9:17 AM CST.
    - cron: '17 15 * * 2'
    # Same-day safety net if the primary run is delayed or Sleeper has not finalized the week.
    - cron: '17 17 * * 2'
    # Wednesday safety net for scoring/status delays.
    - cron: '17 15 * * 3'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to generate (2022-2026)'
        required: false
        default: '2026'
        type: string
      league_id:
        description: 'Optional Sleeper league ID override. Leave blank for known Fantasy Foosball seasons.'
        required: false
        type: string
      week:
        description: 'Specific recap week. Leave blank to detect the latest completed week.'
        required: false
        type: string
      force:
        description: 'Regenerate weekly content if files already exist'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fantasy-foosball-weekly-recap
  cancel-in-progress: false

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    environment: recap-bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not available to the recap-bot environment."
            exit 1
          fi
          echo "OPENAI_API_KEY is available to this job."

      - name: Generate weekly recap and next-week preview
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          RECAP_SEASON: ${{ inputs.season || '2026' }}
          RECAP_LEAGUE_ID: ${{ inputs.league_id || (inputs.season == '2022' && '857432836574138368' || inputs.season == '2023' && '981027810078756864' || inputs.season == '2024' && '1124840953127903232' || inputs.season == '2025' && '1251987542522212352' || '1389689189200592896') }}
          RECAP_WEEK: ${{ inputs.week }}
          RECAP_FORCE: ${{ inputs.force }}
        run: node scripts/run-weekly-content.mjs

      - name: Commit new weekly content
        run: |
          git config user.name "sickened36"
          git config user.email "121896441+sickened36@users.noreply.github.com"
          git add static/recaps static/previews
          if git diff --cached --quiet; then
            echo "No new weekly content to commit."
            exit 0
          fi
          git commit -m "Publish Fantasy Foosball weekly content"
          git pull --rebase origin master
          git push
