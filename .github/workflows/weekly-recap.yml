name: Fantasy Foosball Weekly Recap

on:
  schedule:
    # Tuesday morning after the fantasy week is complete.
    # 15:00 UTC = 10:00 AM CDT / 9:00 AM CST.
    - cron: '0 15 * * 2'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to generate (2022-2026)'
        required: false
        default: '2026'
        type: string
      league_id:
        description: 'Optional Sleeper league ID override. Leave blank for known Fantasy Foosball seasons.'
        required: false
        type: string
      week:
        description: 'Specific week. Leave blank to use the latest completed week.'
        required: false
        type: string
      force:
        description: 'Regenerate the recap if this week already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fantasy-foosball-weekly-recap
  cancel-in-progress: false

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    environment: recap-bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not available to the recap-bot environment."
            exit 1
          fi
          echo "OPENAI_API_KEY is available to this job."

      - name: Generate weekly recap
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          RECAP_SEASON: ${{ inputs.season || '2026' }}
          RECAP_LEAGUE_ID: ${{ inputs.league_id || (inputs.season == '2022' && '857432836574138368' || inputs.season == '2023' && '981027810078756864' || inputs.season == '2024' && '1124840953127903232' || inputs.season == '2025' && '1251987542522212352' || '1389689189200592896') }}
          RECAP_WEEK: ${{ inputs.week }}
          RECAP_FORCE: ${{ inputs.force }}
        run: node scripts/generate-weekly-recap.mjs

      - name: Commit new recap
        run: |
          # Vercel checks the Git author on GitHub-triggered deployments.
          # Attribute automated recap commits to the repository owner's GitHub identity.
          git config user.name "sickened36"
          git config user.email "121896441+sickened36@users.noreply.github.com"
          git add static/recaps
          if git diff --cached --quiet; then
            echo "No new recap to commit."
            exit 0
          fi
          git commit -m "Publish Fantasy Foosball weekly recap"
          git push
