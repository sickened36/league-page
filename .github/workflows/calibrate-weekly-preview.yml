name: Calibrate Weekly Preview Model

on:
  push:
    paths:
      - '.github/workflows/calibrate-weekly-preview.yml'

permissions:
  contents: write

jobs:
  calibrate-preview:
    runs-on: ubuntu-latest
    environment: recap-bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Calibrate early-season strength model
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-weekly-preview.mjs')
          source = path.read_text()

          old_ppg = "const smoothedPPG = team.games\n      ? (team.pointsFor + leagueAverage * 2) / (team.games + 2)\n      : leagueAverage;"
          new_ppg = "// Regress early scoring toward league average so one week cannot dominate the model.\n    const scoringPriorGames = Math.max(1, 5 - Math.min(team.games, 4));\n    const smoothedPPG = team.games\n      ? (team.pointsFor + leagueAverage * scoringPriorGames) / (team.games + scoringPriorGames)\n      : leagueAverage;"

          if old_ppg not in source:
              raise SystemExit('Expected scoring prior block was not found; refusing to patch.')

          source = source.replace(old_ppg, new_ppg, 1)
          source = source.replace('mean: smoothedPPG + (smoothedWinPct - 0.5) * 14,', 'mean: smoothedPPG + (smoothedWinPct - 0.5) * 8,', 1)
          source = source.replace('normal(random) * 18', 'normal(random) * 22')
          path.write_text(source)
          PY

      - name: Regenerate Week 2 preview with calibrated odds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          PREVIEW_SEASON: '2026'
          PREVIEW_LEAGUE_ID: '1389689189200592896'
          PREVIEW_WEEK: '2'
          PREVIEW_FORCE: 'true'
        run: node scripts/generate-weekly-preview.mjs

      - name: Publish calibrated model and preview
        run: |
          git config user.name "sickened36"
          git config user.email "121896441+sickened36@users.noreply.github.com"
          git add scripts/generate-weekly-preview.mjs static/previews/2026
          git commit -m "Calibrate playoff odds for early season"
          git pull --rebase origin master
          git push
