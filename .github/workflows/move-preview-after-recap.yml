name: Move Preview After Recap

on:
  push:
    paths:
      - '.github/workflows/move-preview-after-recap.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move preview below recap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/routes/recaps/+page.svelte')
          text = path.read_text(encoding='utf-8')

          preview_start = '  {#if data.preview}\n    <section class="preview-section" aria-label="Upcoming weekly preview">'
          weeks_start = '  {#if data.weeks?.length}'

          start = text.index(preview_start)
          end = text.index(weeks_start, start)
          preview_block = text[start:end]
          text = text[:start] + text[end:]

          final_tail = '  {/if}\n</div>\n</PageShell>'
          insert_at = text.rindex(final_tail) + len('  {/if}\n')
          text = text[:insert_at] + '\n' + preview_block + text[insert_at:]

          text, css_changes = re.subn(
              r'  \.preview-section \{\n\s+margin-bottom: 44px;\n\s+padding-bottom: 38px;\n\s+border-bottom: 1px solid var\(--ddd\);\n  \}',
              '  .preview-section {\n    margin-top: 48px;\n    padding-top: 38px;\n    border-top: 1px solid var(--ddd);\n  }',
              text,
              count=1,
          )
          if css_changes != 1:
              raise SystemExit('Expected preview-section CSS was not found.')

          text = text.replace(
              'description="Upcoming matchup stakes, modeled playoff odds, game stories and weekly awards built from the league\'s Sleeper data."',
              'description="Game stories and weekly awards from completed weeks, followed by upcoming matchup stakes and modeled playoff odds."',
              1,
          )
          text = text.replace(
              'content="AI-generated weekly matchup previews, playoff stakes and game recaps for Fantasy Foosball."',
              'content="AI-generated weekly game recaps, awards, matchup previews and playoff stakes for Fantasy Foosball."',
              1,
          )

          markup_preview = text.index(preview_start)
          recap = text.index('  {#if data.recap}')
          if markup_preview <= recap:
              raise SystemExit('Preview did not move below the recap block.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Publish change
        run: |
          git config user.name "sickened36"
          git config user.email "121896441+sickened36@users.noreply.github.com"
          git rm .github/workflows/move-preview-after-recap.yml
          git add src/routes/recaps/+page.svelte
          git commit -m "Show weekly preview after recap"
          git pull --rebase origin master
          git push
