name: Remove Rival Mentions

# One-time cleanup; this file removes itself after a successful run.
on:
  push:
    paths:
      - '.github/workflows/remove-rival-mentions.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove rival content
        run: python scripts/remove-rival-mentions.py

      - name: Publish cleanup
        run: |
          git config user.name "sickened36"
          git config user.email "121896441+sickened36@users.noreply.github.com"
          git add -A
          git commit -m "Remove rivals and rivalry mentions"
          git pull --rebase origin master
          git push
