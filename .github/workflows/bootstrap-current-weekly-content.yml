name: Bootstrap Current Weekly Content

on:
  push:
    paths:
      - '.github/workflows/bootstrap-current-weekly-content.yml'

permissions:
  contents: write

concurrency:
  group: fantasy-foosball-weekly-recap
  cancel-in-progress: false

jobs:
  generate-current-content:
    runs-on: ubuntu-latest
    environment: recap-bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Week 1 recap and Week 2 preview
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          RECAP_SEASON: '2026'
          RECAP_LEAGUE_ID: '1389689189200592896'
          RECAP_WEEK: '1'
          RECAP_FORCE: 'false'
        run: node scripts/run-weekly-content.mjs

      - name: Publish weekly content
        run: |
          git config user.name "sickened36"
          git config user.email "121896441+sickened36@users.noreply.github.com"
          git add static/recaps static/previews
          if git diff --cached --quiet; then
            echo "No new weekly content to commit."
            exit 0
          fi
          git commit -m "Publish Week 1 recap and Week 2 preview"
          git pull --rebase origin master
          git push
